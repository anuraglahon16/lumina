# The three-service architecture, reproducible on any machine with Docker.
#
# This exists so the separation can be verified without a hosting account. It is
# the same image and the same entry points as the Fly deployment; what differs is
# only who provides the network boundary — Docker here, Fly's private IPv6 there.
#
#   gateway   the only service with a published port. No provider credentials.
#   agent     no published port. Reachable only on the internal network.
#   worker    no published port and no HTTP listener at all.
#   mongo     local, so the stack needs no cloud account to run.
#
# Usage is in docs/verify-architecture.md.

services:
  mongo:
    image: mongo:7
    command: ["--quiet", "--logpath", "/dev/null"]
    networks: [private]
    # Deliberately unpublished: only the agent and worker speak to it.

  agent:
    build: .
    command: ["node", "src/agent/server.js"]
    # No `ports:` key. Nothing outside this compose network can reach it.
    networks: [private]
    environment:
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "8787"
      MONGODB_URI: "mongodb://mongo:27017"
      MONGODB_DB: "lumina_local"
      EMBEDDING_PROVIDER: "local"
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:-local-demo-token}"
      # Provider credentials live here and in the worker, nowhere else.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
    depends_on: [mongo]

  worker:
    build: .
    command: ["node", "src/agent/worker.js"]
    # No ports and no listener: it claims jobs and writes to the database.
    networks: [private]
    environment:
      MONGODB_URI: "mongodb://mongo:27017"
      MONGODB_DB: "lumina_local"
      EMBEDDING_PROVIDER: "local"
      JOB_POLL_MS: "1000"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
    depends_on: [mongo]

  gateway:
    build: .
    command: ["node", "src/gateway/server.js"]
    # The only published port in the stack.
    ports: ["8080:8080"]
    networks: [private]
    environment:
      GATEWAY_PORT: "8080"
      AGENT_URL: "http://agent:8787"
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:-local-demo-token}"
      # No ANTHROPIC_API_KEY. No TAVILY_API_KEY. Asserted by
      # tests/serviceBoundary.test.js and by the check in
      # docs/verify-architecture.md.
    depends_on: [agent]

networks:
  private:
